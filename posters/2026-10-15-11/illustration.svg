    <path d="M676 420 L668 372 H712 L704 420 Z" fill="#660005"/>
    <path d="M690 372 Q666 330 680 300 Q700 336 690 372" fill="#8FCB63"/>
    <path d="M690 372 Q716 340 730 330 Q724 362 690 372" fill="#8FCB63"/>
    <path d="M690 372 Q660 356 652 340 Q684 340 690 372" fill="#8FCB63"/>

