    <path d="M532 268 L555 300 L578 268" fill="#FFFFFF"/>
    <rect x="542" y="232" width="26" height="36" rx="10" fill="#C68B67"/>
    <circle cx="555" cy="196" r="52" fill="#C68B67"/>
    <path d="M503 190 Q500 140 555 140 Q612 140 607 188 Q596 166 560 166 Q522 166 512 194 Z" fill="#2B0A0C"/>
    <circle cx="537" cy="202" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
    <circle cx="573" cy="202" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
    <line x1="551" y1="202" x2="559" y2="202"/>
