    <rect x="80" y="420" width="640" height="26" rx="8" fill="#FFFFFF"/>
    <line x1="170" y1="446" x2="150" y2="590"/>
    <line x1="630" y1="446" x2="650" y2="590"/>
    <line x1="400" y1="446" x2="400" y2="590"/>

