    <!-- laptops (lids facing us) -->
    <rect x="178" y="318" width="150" height="100" rx="10" fill="#D6D6D6"/>
    <circle cx="253" cy="366" r="13" fill="#660005"/>
    <rect x="472" y="318" width="150" height="100" rx="10" fill="#D6D6D6"/>
    <rect x="530" y="352" width="34" height="26" rx="5" fill="#F6CB45"/>

